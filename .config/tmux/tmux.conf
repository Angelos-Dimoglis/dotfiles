unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -g status-position top

# Plugins (must be declared before tpm runs)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'   # auto-restore on tmux start
set -g @resurrect-capture-pane-contents 'on'  # also save pane text

# Status bar
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-justify centre

# Left
set -g status-left-length 40
set -g status-left "  #[fg=red,bg=#282828]\ue0b6#[bg=red,fg=brightwhite,bold] #S #[fg=red,bg=#282828]\ue0b4#[default]"

# Center
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=red,bg=#282828]\ue0b6#[bg=red,fg=brightwhite,bold] #I:#W #[fg=red,bg=#282828]\ue0b4#[default]"

# Right
set -g status-right-length 60
set -g status-right "#[fg=red,bg=#282828]\ue0b6#[bg=red,fg=brightwhite,bold] #(kubectl config current-context 2>/dev/null || echo none) #[fg=red,bg=#282828]\ue0b4#[default]  "

set -g status 2
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''

run '~/.config/tmux/plugins/tpm/tpm'
